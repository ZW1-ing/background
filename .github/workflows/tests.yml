name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run Python tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s codex-wallpaper/tests -v > python-tests.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            message="$(tail -n 120 python-tests.log | tr '\n' '|' | tr '\r' ' ')"
            printf '::error title=Python tests::%s\n' "$message"
            cat python-tests.log
            exit "$status"
          fi

      - name: Run frontend tests
        run: node codex-wallpaper/tests/test_panel_api.js
