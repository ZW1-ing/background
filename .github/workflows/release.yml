name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run tests
        run: python3 -m unittest discover -s codex-wallpaper/tests -v

      - name: Build versioned archive
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE="codex-wallpaper-${VERSION}-windows-macos.zip"
          rm -rf build dist
          mkdir -p build dist
          cp -R codex-wallpaper build/
          find build -name __pycache__ -type d -prune -exec rm -rf {} +
          find build -name '*.pyc' -delete
          (cd build && zip -qr "../dist/${ARCHIVE}" codex-wallpaper)
          (cd dist && sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256")

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE="codex-wallpaper-${VERSION}-windows-macos.zip"
          gh release create "${GITHUB_REF_NAME}" \
            "dist/${ARCHIVE}" \
            "dist/${ARCHIVE}.sha256" \
            --title "Codex Wallpaper ${VERSION} - Windows + macOS" \
            --notes-file RELEASE_NOTES.md
