name: Windows Store app smoke test

on:
  push:
    paths:
      - ".github/workflows/windows-store-smoke.yml"
      - "codex-wallpaper/scripts/platform_support.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install ChatGPT from Microsoft Store
        shell: pwsh
        run: |
          $output = winget source update --name msstore `
            --accept-source-agreements 2>&1 | Out-String
          $output += winget search ChatGPT --source msstore `
            --accept-source-agreements --disable-interactivity 2>&1 | Out-String
          $output += winget install --id 9NT1R1C2HH7J -e --source msstore `
            --accept-package-agreements --accept-source-agreements `
            --disable-interactivity 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) {
            $message = ($output -replace "\r?\n", " | ")
            Write-Output "::error title=Winget install::$message"
            exit 1
          }
          Write-Output $output

      - name: Verify the panel can detect the Store app
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          python -c @'
          import pathlib
          import sys
          sys.path.insert(0, str(pathlib.Path("codex-wallpaper/scripts").resolve()))
          from platform_support import detect_applications

          apps = detect_applications("win32")
          matches = [
              app for app in apps
              if app["name"] == "ChatGPT" and app["copyable"]
          ]
          if not matches:
              raise SystemExit("Panel did not detect the Store ChatGPT app: %r" % apps)
          print(matches[0]["executable"])
          '@

      - name: Copy Store app to a writable directory
        shell: pwsh
        run: |
          $package = Get-AppxPackage |
            Where-Object { $_.Name -match 'ChatGPT|OpenAI' } |
            Sort-Object Version -Descending |
            Select-Object -First 1
          if (-not $package) {
            throw "Microsoft Store ChatGPT package was not installed."
          }

          $manifest = Get-AppxPackageManifest $package
          $declared = @(
            $manifest.Package.Applications.Application |
              ForEach-Object { $_.Executable } |
              Where-Object { $_ }
          )
          $available = @(
            Get-ChildItem -Path $package.InstallLocation `
              -Recurse -File -Filter *.exe -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName
          )
          Write-Output (
            "::notice title=Store executables::Declared: " +
            "$($declared -join ', ') | Found: $($available -join ', ')"
          )
          Write-Output "Declared executables: $($declared -join ', ')"
          $exe = $null
          foreach ($relative in $declared) {
            $candidate = Join-Path $package.InstallLocation $relative
            if (Test-Path $candidate) {
              $exe = Get-Item $candidate
              break
            }
          }
          if (-not $exe) {
            throw (
              "No declared executable was found. Declared: " +
              "$($declared -join ', '). Available: $($available -join ', ')"
            )
          }

          $copyRoot = Join-Path $env:LOCALAPPDATA `
            "codex-wallpaper\writable-apps\ci-smoke"
          if (Test-Path $copyRoot) {
            Remove-Item -Recurse -Force $copyRoot
          }
          New-Item -ItemType Directory -Path $copyRoot | Out-Null
          robocopy $exe.DirectoryName $copyRoot /E /R:2 /W:2 | Out-Null
          if ($LASTEXITCODE -ge 8) {
            throw "Could not copy the Store app. robocopy exit code: $LASTEXITCODE"
          }

          $copyExe = Join-Path $copyRoot $exe.Name
          Write-Output "::notice title=Store copy::Copied to $copyExe"
          "SMOKE_CHATGPT_EXE=$copyExe" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify the unmodified Store app copy starts
        shell: pwsh
        run: |
          trap {
            $message = ($_ | Out-String) -replace "\r?\n", " | "
            Write-Output "::error title=Store launch::$message"
            exit 1
          }
          $copyExe = $env:SMOKE_CHATGPT_EXE
          if (-not $copyExe) {
            throw "The copied ChatGPT.exe path was not available."
          }
          $process = Start-Process -FilePath $copyExe -PassThru
          Start-Sleep -Seconds 12
          if ($process.HasExited) {
            throw "The unmodified Store app copy exited with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id -Force
          Write-Output "Unmodified Store app copy started successfully."

      - name: Apply wallpaper to the Store app copy
        shell: pwsh
        run: |
          trap {
            $message = ($_ | Out-String) -replace "\r?\n", " | "
            Write-Output "::error title=Store patch::$message"
            exit 1
          }
          $copyExe = $env:SMOKE_CHATGPT_EXE
          if (-not $copyExe) {
            throw "The copied ChatGPT.exe path was not available."
          }
          $env:PYTHONIOENCODING = "utf-8"
          python .\codex-wallpaper\scripts\codex_theme_patcher.py `
            --app $copyExe `
            --image .\codex-wallpaper\assets\default-wallpaper.jpg `
            --allow-unknown-windows

          $process = Start-Process -FilePath $copyExe -PassThru
          Start-Sleep -Seconds 12
          if ($process.HasExited) {
            throw "The patched Store app copy exited with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id -Force
          Write-Output "Patched Store app copy started successfully."
